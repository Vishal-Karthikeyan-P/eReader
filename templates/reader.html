<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Reader</title>

    <!-- =====================================================
         PDF.JS
         Using the stable non-module build
    ====================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- =====================================================
         EPUB.JS
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #111827;

            color: white;
        }


        body.light {
            background: #f3f4f6;
            color: #111827;
        }


        body.sepia {
            background: #d8c7a5;
            color: #3e3526;
        }


        /* =====================================================
           READER
        ====================================================== */

        .reader {

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           TOP BAR
        ====================================================== */

        .topbar {

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                8px 14px;

            background: #111827;

            border-bottom:
                1px solid #374151;

            z-index: 50;
        }


        body.light .topbar {
            background: white;
            color: #111827;
            border-bottom-color: #e5e7eb;
        }


        body.sepia .topbar {
            background: #3e3526;
            color: #f4ecd8;
            border-bottom-color: #66563e;
        }


        .back {

            border: none;

            background: transparent;

            color: inherit;

            font-size: 24px;

            width: 40px;
            height: 40px;

            border-radius: 8px;

            cursor: pointer;
        }


        .back:hover {
            background: rgba(255,255,255,.1);
        }


        .title {

            flex: 1;

            min-width: 0;
        }


        .title strong {

            display: block;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            font-size: 16px;
        }


        .title small {

            display: block;

            margin-top: 2px;

            color: #9ca3af;

            font-size: 12px;
        }


        .controls {

            display: flex;

            gap: 5px;

            align-items: center;
        }


        .controls button {

            border:
                1px solid #374151;

            background:
                #1f2937;

            color: white;

            padding:
                7px 10px;

            min-width: 36px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }


        .controls button:hover {

            background:
                #374151;
        }


        .controls button:disabled {

            opacity: .4;

            cursor: not-allowed;
        }


        body.light .controls button {

            background: #f9fafb;

            color: #111827;

            border-color: #d1d5db;
        }


        /* =====================================================
           READER AREA
        ====================================================== */

        .reader-area {

            position: relative;

            flex: 1;

            min-height: 0;

            overflow: hidden;

            background:
                #374151;
        }


        body.light .reader-area {
            background: #e5e7eb;
        }


        body.sepia .reader-area {
            background: #d9c8a5;
        }


        /* =====================================================
           PDF
        ====================================================== */

        #pdfContainer {

            width: 100%;

            height: 100%;

            overflow: auto;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 25px;

            scroll-behavior: smooth;
        }


        #pdfCanvas {

            display: block;

            background: white;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,.35);

            max-width: none;

            transform-origin:
                center top;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .loading {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(17,24,39,.75);

            z-index: 40;
        }


        .loading-box {

            padding: 25px 35px;

            background: #1f2937;

            border:
                1px solid #374151;

            border-radius: 14px;

            text-align: center;
        }


        .spinner {

            width: 35px;
            height: 35px;

            margin:
                0 auto 15px;

            border:
                3px solid #374151;

            border-top-color:
                #60a5fa;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =====================================================
           EPUB
        ====================================================== */

        #epubContainer {

            position: absolute;

            inset: 0;

            display: none;

            background: white;
        }


        body.sepia #epubContainer {
            background: #f4ecd8;
        }


        #epubViewer {

            width: 100%;

            height: 100%;
        }


        /* =====================================================
           EPUB OPTIONS
        ====================================================== */

        .epub-options {

            position: absolute;

            right: 15px;

            top: 15px;

            z-index: 100;

            display: none;

            width: 250px;

            padding: 20px;

            background:
                #1f2937;

            border:
                1px solid #374151;

            border-radius: 14px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.4);
        }


        .epub-options h3 {

            margin:
                0 0 15px;

            font-size: 15px;
        }


        .epub-options label {

            display: block;

            margin:
                14px 0 6px;

            color:
                #d1d5db;

            font-size: 13px;
        }


        .epub-options input {

            width: 100%;
        }


        .theme-buttons {

            display: flex;

            gap: 6px;

            margin-top: 8px;
        }


        .theme-buttons button {

            flex: 1;

            border: 1px solid #4b5563;

            border-radius: 7px;

            padding: 7px;

            cursor: pointer;
        }


        /* =====================================================
           ERROR
        ====================================================== */

        .message {

            position: absolute;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 25px;

            text-align: center;

            z-index: 30;
        }


        .message-box {

            width: min(500px, 90%);

            padding: 30px;

            background:
                #1f2937;

            border:
                1px solid #374151;

            border-radius: 16px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.35);
        }


        .message-box h2 {

            margin-top: 0;

            margin-bottom: 10px;
        }


        .message-box p {

            color: #d1d5db;

            line-height: 1.6;

            word-break: break-word;
        }


        .message-box button {

            margin-top: 15px;

            padding:
                9px 18px;

            border: none;

            border-radius: 8px;

            background: #3b82f6;

            color: white;

            cursor: pointer;
        }


        /* =====================================================
           BOTTOM BAR
        ====================================================== */

        .bottombar {

            height: 58px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            background:
                #111827;

            border-top:
                1px solid #374151;

            z-index: 50;
        }


        body.light .bottombar {

            background: white;

            border-top-color:
                #e5e7eb;
        }


        body.sepia .bottombar {

            background:
                #3e3526;
        }


        .bottombar button {

            border:
                1px solid #374151;

            background:
                #1f2937;

            color: white;

            padding:
                7px 14px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }


        .bottombar button:hover {

            background:
                #374151;
        }


        .bottombar button:disabled {

            opacity: .4;

            cursor: not-allowed;
        }


        .bottombar span {

            min-width: 80px;

            text-align: center;

            color: #d1d5db;

            font-size: 13px;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media(max-width:700px) {

            .topbar {

                height: 54px;

                padding:
                    6px 8px;
            }


            .controls {

                gap: 3px;
            }


            .controls button {

                min-width: 32px;

                padding:
                    6px 7px;

                font-size: 13px;
            }


            .title small {

                display: none;
            }


            #pdfContainer {

                padding: 10px;
            }


            .bottombar {

                height: 52px;

                gap: 6px;
            }


            .bottombar span {

                min-width: 65px;
            }


            .epub-options {

                width: 220px;

                right: 8px;

                top: 8px;
            }

        }

    </style>

</head>


<body class="dark">


<div class="reader">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">


        <button
            class="back"
            onclick="goBack()"
            title="Back to bookshelf"
        >
            ←
        </button>


        <div class="title">

            <strong id="bookTitle">
                Loading book...
            </strong>

            <small id="bookType">
                Loading...
            </small>

        </div>


        <div class="controls">


            <button
                id="zoomOutButton"
                onclick="zoomOut()"
                title="Zoom out"
            >
                −
            </button>


            <button
                id="zoomInButton"
                onclick="zoomIn()"
                title="Zoom in"
            >
                +
            </button>


            <button
                id="rotateButton"
                onclick="rotate()"
                title="Rotate"
            >
                ↻
            </button>


            <button
                onclick="toggleFullscreen()"
                title="Fullscreen"
            >
                ⛶
            </button>


            <button
                onclick="toggleTheme()"
                title="Change theme"
            >
                ☾
            </button>


            <button
                id="optionsButton"
                onclick="toggleEpubOptions()"
                style="display:none"
                title="EPUB settings"
            >
                Aa
            </button>

        </div>

    </div>



    <!-- =====================================================
         READER AREA
    ====================================================== -->

    <div
        class="reader-area"
        id="readerArea"
    >


        <!-- LOADING -->

        <div
            class="loading"
            id="loading"
        >

            <div class="loading-box">

                <div class="spinner"></div>

                <div id="loadingText">
                    Opening book...
                </div>

            </div>

        </div>



        <!-- PDF -->

        <div id="pdfContainer">

            <canvas
                id="pdfCanvas"
            ></canvas>

        </div>



        <!-- EPUB -->

        <div id="epubContainer">

            <div
                id="epubViewer"
            ></div>


            <div
                class="epub-options"
                id="epubOptions"
            >

                <h3>
                    Reading Settings
                </h3>


                <label>
                    Font Size
                </label>

                <input
                    type="range"
                    min="80"
                    max="180"
                    value="100"
                    id="fontSize"
                >


                <label>
                    Line Spacing
                </label>

                <input
                    type="range"
                    min="100"
                    max="220"
                    value="150"
                    id="lineSpacing"
                >


                <label>
                    Margins
                </label>

                <input
                    type="range"
                    min="0"
                    max="120"
                    value="30"
                    id="margins"
                >


                <label>
                    Theme
                </label>

                <div class="theme-buttons">

                    <button
                        onclick="setEpubTheme('light')"
                    >
                        Light
                    </button>

                    <button
                        onclick="setEpubTheme('sepia')"
                    >
                        Sepia
                    </button>

                    <button
                        onclick="setEpubTheme('dark')"
                    >
                        Dark

                </div>

            </div>

        </div>



        <!-- ERROR -->

        <div
            class="message"
            id="message"
        >

            <div class="message-box">

                <h2>
                    Unable to open book
                </h2>

                <p
                    id="messageText"
                ></p>

                <button
                    onclick="goBack()"
                >
                    Back to Bookshelf
                </button>

            </div>

        </div>

    </div>



    <!-- =====================================================
         BOTTOM BAR
    ====================================================== -->

    <div class="bottombar">


        <button
            id="previousButton"
            onclick="previousPage()"
        >
            ←
        </button>


        <span id="pageInfo">
            -
        </span>


        <button
            id="nextButton"
            onclick="nextPage()"
        >
            →
        </button>


        <span id="progress">
            0%
        </span>

    </div>


</div>



<script>


/* =========================================================
   PDF.JS CONFIGURATION
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   STATE
========================================================= */

let book = null;

let pdf = null;

let currentPage = 1;

let totalPages = 0;

let pdfScale = 1.25;

let rotation = 0;

let epubBook = null;

let epubRendition = null;


/* =========================================================
   ELEMENT HELPERS
========================================================= */

function $(id) {

    return document.getElementById(id);

}


/* =========================================================
   SHOW / HIDE LOADING
========================================================= */

function showLoading(text = "Opening book...") {

    $("loadingText").textContent = text;

    $("loading").style.display = "flex";

}


function hideLoading() {

    $("loading").style.display = "none";

}


/* =========================================================
   ERROR
========================================================= */

function showError(text) {

    hideLoading();

    $("message").style.display = "flex";

    $("messageText").textContent = text;

}


/* =========================================================
   GET BOOK FROM LOCAL STORAGE
========================================================= */

function getCurrentBook() {

    /*
       Primary method:
       bookshelf should save:

       localStorage.setItem(
           "currentBook",
           JSON.stringify(book)
       );
    */

    const raw =
        localStorage.getItem("currentBook");


    if (raw) {

        try {

            const parsed =
                JSON.parse(raw);

            if (
                parsed &&
                typeof parsed === "object"
            ) {

                console.log(
                    "Book loaded from currentBook:",
                    parsed
                );

                return parsed;

            }

        }
        catch(error) {

            console.error(
                "Invalid currentBook:",
                error
            );

        }

    }


    /*
       Backup method:

       /reader?id=GOOGLE_DRIVE_FILE_ID

       This allows the bookshelf to open the reader
       even if currentBook wasn't saved correctly.
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    if (id) {

        const possibleKeys = [
            "books",
            "libraryBooks",
            "cachedBooks",
            "bookshelf",
            "library"
        ];


        for (
            const key of possibleKeys
        ) {

            try {

                const value =
                    JSON.parse(
                        localStorage.getItem(key)
                    );


                if (
                    Array.isArray(value)
                ) {

                    const found =
                        value.find(
                            item =>
                                String(item.id) ===
                                String(id)
                        );


                    if (found) {

                        localStorage.setItem(
                            "currentBook",
                            JSON.stringify(found)
                        );

                        return found;

                    }

                }

            }
            catch(error) {

                // Ignore invalid localStorage values

            }

        }

    }


    return null;

}


/* =========================================================
   READING DATA
========================================================= */

function getReadingData() {

    if (!book || !book.id) {
        return null;
    }


    try {

        return JSON.parse(
            localStorage.getItem(
                "reading_" + book.id
            ) || "null"
        );

    }
    catch(error) {

        return null;

    }

}


function saveReadingData(data) {

    if (!book || !book.id) {
        return;
    }


    const old =
        getReadingData() || {};


    const updated = {

        ...old,

        ...data,

        updatedAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "reading_" + book.id,
        JSON.stringify(updated)
    );


    /*
       Keep a reading history list.
    */

    let history = [];


    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "readingHistory"
                ) || "[]"
            );

        if (!Array.isArray(history)) {
            history = [];
        }

    }
    catch(error) {

        history = [];

    }


    const historyBook = {

        id: book.id,

        title: book.title || book.name,

        type: book.type,

        progress:
            Number(updated.progress || 0),

        lastRead:
            new Date().toISOString()

    };


    history =
        history.filter(
            item =>
                String(item.id) !==
                String(book.id)
        );


    history.unshift(
        historyBook
    );


    /*
       Keep the most recent 50 books.
    */

    history =
        history.slice(0, 50);


    localStorage.setItem(
        "readingHistory",
        JSON.stringify(history)
    );


    /*
       Completed book
    */

    if (
        Number(updated.progress || 0) >= 100
    ) {

        localStorage.setItem(
            "completed_" + book.id,
            "true"
        );

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

    showLoading(
        "Loading selected book..."
    );


    book =
        getCurrentBook();


    if (!book) {

        showError(
            "No book was selected. " +
            "Please return to the bookshelf and open a book."
        );

        return;

    }


    console.log(
        "Selected book:",
        book
    );


    $("bookTitle").textContent =
        book.title ||
        book.name ||
        "Untitled Book";


    $("bookType").textContent =
        (
            book.type ||
            ""
        ).toUpperCase();


    /*
       Normalize type in case the backend sends
       uppercase extensions.
    */

    const type =
        String(
            book.type || ""
        ).toLowerCase();


    try {

        if (type === "pdf") {

            await openPDF();

        }

        else if (type === "epub") {

            await openEPUB();

        }

        else {

            showError(
                "Unsupported book format: " +
                type
            );

        }

    }
    catch(error) {

        console.error(
            "Reader initialization error:",
            error
        );

        showError(
            error.message ||
            "Unable to open the book."
        );

    }

}


/* =========================================================
   GET PDF URL
========================================================= */

function getPDFUrl() {

    /*
       IMPORTANT:

       Do NOT use:

           book.link

       because that is the Google Drive viewer URL.

       Prefer:

           book.download_url

       which is generated by the Flask backend.
    */


    if (
        book.download_url &&
        String(book.download_url).trim()
    ) {

        return book.download_url;

    }


    /*
       Some older cached books may have a
       downloadUrl property.
    */

    if (
        book.downloadUrl &&
        String(book.downloadUrl).trim()
    ) {

        return book.downloadUrl;

    }


    /*
       Last fallback.

       This will only work if the backend/API
       allows browser access to the Drive file.
    */

    if (book.id) {

        return (
            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(book.id) +
            "?alt=media"
        );

    }


    return null;

}


/* =========================================================
   OPEN PDF
========================================================= */

async function openPDF() {

    $("epubContainer").style.display =
        "none";


    $("pdfContainer").style.display =
        "flex";


    $("optionsButton").style.display =
        "none";


    const pdfUrl =
        getPDFUrl();


    console.log(
        "PDF URL:",
        pdfUrl
    );


    if (!pdfUrl) {

        throw new Error(
            "No PDF download URL was provided for this book."
        );

    }


    showLoading(
        "Downloading PDF..."
    );


    try {

        /*
           PDF.js fetches the actual PDF bytes here.

           This MUST be the download URL and NOT
           Google Drive's webViewLink.
        */

        const loadingTask =
            pdfjsLib.getDocument({

                url: pdfUrl,

                withCredentials: false,

                /*
                   Allows PDF.js to request
                   HTTP range data when supported.
                */

                disableAutoFetch: false,

                disableStream: false

            });


        loadingTask.onProgress =
            function(progressData) {

                if (
                    progressData &&
                    progressData.total
                ) {

                    const percent =
                        Math.round(
                            (
                                progressData.loaded /
                                progressData.total
                            ) * 100
                        );


                    $("loadingText").textContent =
                        `Downloading PDF... ${percent}%`;

                }

            };


        pdf =
            await loadingTask.promise;


        totalPages =
            pdf.numPages;


        console.log(
            "PDF loaded:",
            totalPages,
            "pages"
        );


        /*
           Restore saved page.
        */

        const saved =
            getReadingData();


        if (
            saved &&
            Number(saved.page) > 0
        ) {

            currentPage =
                Math.min(
                    totalPages,

                    Math.max(
                        1,
                        Number(saved.page)
                    )
                );

        }
        else {

            currentPage = 1;

        }


        hideLoading();


        await renderPDFPage(
            currentPage
        );

    }
    catch(error) {

        console.error(
            "PDF.js error:",
            error
        );


        let message =
            error.message ||
            String(error);


        /*
           Give a useful message for CORS/network errors.
        */

        if (
            message.toLowerCase().includes(
                "network"
            )
        ) {

            message =
                "PDF could not be downloaded from Google Drive. " +
                "Make sure the file is publicly accessible and " +
                "that the backend provides a valid download_url.";

        }


        throw new Error(
            "Unable to open PDF. " +
            message
        );

    }

}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

async function renderPDFPage(pageNumber) {

    if (!pdf) {
        return;
    }


    showLoading(
        `Rendering page ${pageNumber}...`
    );


    const page =
        await pdf.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({

            scale: pdfScale,

            rotation: rotation

        });


    const canvas =
        $("pdfCanvas");


    const context =
        canvas.getContext("2d");


    /*
       Improve rendering on high-DPI screens.
    */

    const devicePixelRatio =
        window.devicePixelRatio || 1;


    canvas.width =
        Math.floor(
            viewport.width *
            devicePixelRatio
        );


    canvas.height =
        Math.floor(
            viewport.height *
            devicePixelRatio
        );


    canvas.style.width =
        `${viewport.width}px`;


    canvas.style.height =
        `${viewport.height}px`;


    const renderContext = {

        canvasContext:
            context,

        viewport:
            viewport

    };


    /*
       Scale the canvas context for
       high-resolution displays.
    */

    context.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );


    await page.render(
        renderContext
    ).promise;


    hideLoading();


    /*
       Update page number.
    */

    $("pageInfo").textContent =
        `${pageNumber} / ${totalPages}`;


    /*
       Completion percentage.
    */

    const progress =
        Math.min(
            100,
            Math.round(
                (
                    pageNumber /
                    totalPages
                ) * 100
            )
        );


    $("progress").textContent =
        `${progress}%`;


    /*
       Save progress.
    */

    saveReadingData({

        page:
            pageNumber,

        progress:
            progress

    });


    updateNavigation();


    /*
       Return scroll position to top
       whenever a new page is rendered.
    */

    $("pdfContainer").scrollTop = 0;

}


/* =========================================================
   PDF NAVIGATION
========================================================= */

async function nextPage() {

    if (!pdf) {
        return;
    }


    if (
        currentPage >= totalPages
    ) {

        return;

    }


    currentPage++;


    await renderPDFPage(
        currentPage
    );

}


async function previousPage() {

    if (!pdf) {
        return;
    }


    if (
        currentPage <= 1
    ) {

        return;

    }


    currentPage--;


    await renderPDFPage(
        currentPage
    );

}


/* =========================================================
   NAVIGATION STATE
========================================================= */

function updateNavigation() {

    const previous =
        $("previousButton");


    const next =
        $("nextButton");


    if (!pdf) {

        previous.disabled =
            false;

        next.disabled =
            false;

        return;

    }


    previous.disabled =
        currentPage <= 1;


    next.disabled =
        currentPage >= totalPages;

}


/* =========================================================
   PDF ZOOM
========================================================= */

async function zoomIn() {

    if (
        !book ||
        book.type !== "pdf"
    ) {

        return;

    }


    pdfScale =
        Math.min(
            4,
            pdfScale + 0.15
        );


    await renderPDFPage(
        currentPage
    );

}


async function zoomOut() {

    if (
        !book ||
        book.type !== "pdf"
    ) {

        return;

    }


    pdfScale =
        Math.max(
            0.5,
            pdfScale - 0.15
        );


    await renderPDFPage(
        currentPage
    );

}


/* =========================================================
   PDF ROTATION
========================================================= */

async function rotate() {

    if (
        !book ||
        book.type !== "pdf"
    ) {

        return;

    }


    rotation =
        (
            rotation +
            90
        ) % 360;


    await renderPDFPage(
        currentPage
    );

}


/* =========================================================
   EPUB
========================================================= */

async function openEPUB() {

    $("pdfContainer").style.display =
        "none";


    $("epubContainer").style.display =
        "block";


    $("optionsButton").style.display =
        "block";


    /*
       EPUB.js needs an actual EPUB URL.

       Prefer download_url over Drive viewer link.
    */

    const epubUrl =
        book.download_url ||
        book.downloadUrl ||
        book.link;


    if (!epubUrl) {

        throw new Error(
            "No EPUB download URL was provided."
        );

    }


    console.log(
        "EPUB URL:",
        epubUrl
    );


    showLoading(
        "Loading EPUB..."
    );


    try {

        /*
           Clear previous reader.
        */

        $("epubViewer").innerHTML = "";


        epubBook =
            ePub(
                epubUrl
            );


        epubRendition =
            epubBook.renderTo(
                "epubViewer",
                {

                    width:
                        "100%",

                    height:
                        "100%",

                    spread:
                        "auto",

                    flow:
                        "paginated"

                }
            );


        /*
           Restore saved position.
        */

        const saved =
            getReadingData();


        if (
            saved &&
            saved.position
        ) {

            await epubRendition.display(
                saved.position
            );

        }
        else {

            await epubRendition.display();

        }


        /*
           Register EPUB themes.
        */

        registerEpubThemes();


        /*
           Restore EPUB settings.
        */

        restoreEpubSettings();


        /*
           Track location changes.
        */

        epubRendition.on(
            "relocated",
            function(location) {

                if (
                    !location ||
                    !location.start
                ) {

                    return;

                }


                const percentage =
                    Math.round(
                        (
                            location.start.percentage ||
                            0
                        ) * 100
                    );


                $("progress").textContent =
                    `${percentage}%`;


                $("pageInfo").textContent =
                    "EPUB";


                saveReadingData({

                    position:
                        location.start.cfi,

                    progress:
                        percentage

                });

            }
        );


        hideLoading();

    }
    catch(error) {

        console.error(
            "EPUB error:",
            error
        );


        throw new Error(
            "Unable to open EPUB. " +
            (
                error.message ||
                String(error)
            )
        );

    }

}


/* =========================================================
   EPUB NAVIGATION
========================================================= */

async function nextEPUB() {

    if (!epubRendition) {
        return;
    }


    await epubRendition.next();

}


async function previousEPUB() {

    if (!epubRendition) {
        return;
    }


    await epubRendition.prev();

}


/* =========================================================
   GENERIC NAVIGATION
========================================================= */

async function nextPage() {

    if (
        book &&
        String(book.type).toLowerCase() ===
        "pdf"
    ) {

        await nextPDFPage();

    }

    else if (
        book &&
        String(book.type).toLowerCase() ===
        "epub"
    ) {

        await nextEPUB();

    }

}


async function previousPage() {

    if (
        book &&
        String(book.type).toLowerCase() ===
        "pdf"
    ) {

        await previousPDFPage();

    }

    else if (
        book &&
        String(book.type).toLowerCase() ===
        "epub"
    ) {

        await previousEPUB();

    }

}


/*
   Separate names avoid conflicts with
   generic functions.
*/

async function nextPDFPage() {

    if (!pdf) {
        return;
    }


    if (
        currentPage >= totalPages
    ) {

        return;

    }


    currentPage++;


    await renderPDFPage(
        currentPage
    );

}


async function previousPDFPage() {

    if (!pdf) {
        return;
    }


    if (
        currentPage <= 1
    ) {

        return;

    }


    currentPage--;


    await renderPDFPage(
        currentPage
    );

}


/* =========================================================
   EPUB OPTIONS
========================================================= */

function toggleEpubOptions() {

    const panel =
        $("epubOptions");


    if (
        panel.style.display ===
        "block"
    ) {

        panel.style.display =
            "none";

    }
    else {

        panel.style.display =
            "block";

    }

}


/* =========================================================
   EPUB THEMES
========================================================= */

function registerEpubThemes() {

    if (!epubRendition) {
        return;
    }


    epubRendition.themes.register(
        "readerLight",
        {

            body: {

                color:
                    "#222222 !important",

                background:
                    "#ffffff !important"

            }

        }
    );


    epubRendition.themes.register(
        "readerSepia",
        {

            body: {

                color:
                    "#3e3526 !important",

                background:
                    "#f4ecd8 !important"

            }

        }
    );


    epubRendition.themes.register(
        "readerDark",
        {

            body: {

                color:
                    "#e5e7eb !important",

                background:
                    "#111827 !important"

            }

        }
    );

}


function setEpubTheme(theme) {

    if (!epubRendition) {
        return;
    }


    if (theme === "light") {

        epubRendition.themes.select(
            "readerLight"
        );

    }

    else if (theme === "sepia") {

        epubRendition.themes.select(
            "readerSepia"
        );

    }

    else if (theme === "dark") {

        epubRendition.themes.select(
            "readerDark"
        );

    }


    localStorage.setItem(
        "epubTheme",
        theme
    );

}


/* =========================================================
   EPUB FONT SIZE
========================================================= */

$("fontSize")
    .addEventListener(
        "input",
        function() {

            if (!epubRendition) {
                return;
            }


            const value =
                this.value;


            epubRendition.themes.fontSize(
                `${value}%`
            );


            localStorage.setItem(
                "epubFontSize",
                value
            );

        }
    );


/* =========================================================
   EPUB LINE SPACING
========================================================= */

$("lineSpacing")
    .addEventListener(
        "input",
        function() {

            if (!epubRendition) {
                return;
            }


            const value =
                Number(
                    this.value
                ) / 100;


            epubRendition.themes.default({

                "body": {

                    "line-height":
                        value

                }

            });


            localStorage.setItem(
                "epubLineSpacing",
                this.value
            );

        }
    );


/* =========================================================
   EPUB MARGINS
========================================================= */

$("margins")
    .addEventListener(
        "input",
        function() {

            if (!epubRendition) {
                return;
            }


            const value =
                this.value;


            epubRendition.themes.default({

                "body": {

                    "padding":
                        `0 ${value}px`

                }

            });


            localStorage.setItem(
                "epubMargins",
                value
            );

        }
    );


/* =========================================================
   RESTORE EPUB SETTINGS
========================================================= */

function restoreEpubSettings() {

    const fontSize =
        localStorage.getItem(
            "epubFontSize"
        );


    const lineSpacing =
        localStorage.getItem(
            "epubLineSpacing"
        );


    const margins =
        localStorage.getItem(
            "epubMargins"
        );


    const theme =
        localStorage.getItem(
            "epubTheme"
        );


    if (fontSize) {

        $("fontSize").value =
            fontSize;

        epubRendition.themes.fontSize(
            `${fontSize}%`
        );

    }


    if (lineSpacing) {

        $("lineSpacing").value =
            lineSpacing;

        epubRendition.themes.default({

            "body": {

                "line-height":
                    Number(
                        lineSpacing
                    ) / 100

            }

        });

    }


    if (margins) {

        $("margins").value =
            margins;

        epubRendition.themes.default({

            "body": {

                "padding":
                    `0 ${margins}px`

            }

        });

    }


    if (theme) {

        setEpubTheme(
            theme
        );

    }

}


/* =========================================================
   READER THEME
========================================================= */

function toggleTheme() {

    const body =
        document.body;


    if (
        body.classList.contains(
            "dark"
        )
    ) {

        body.classList.remove(
            "dark"
        );

        body.classList.add(
            "sepia"
        );


        localStorage.setItem(
            "readerTheme",
            "sepia"
        );


        if (epubRendition) {

            setEpubTheme(
                "sepia"
            );

        }

    }

    else if (
        body.classList.contains(
            "sepia"
        )
    ) {

        body.classList.remove(
            "sepia"
        );

        body.classList.add(
            "light"
        );


        localStorage.setItem(
            "readerTheme",
            "light"
        );


        if (epubRendition) {

            setEpubTheme(
                "light"
            );

        }

    }

    else {

        body.classList.remove(
            "light"
        );

        body.classList.add(
            "dark"
        );


        localStorage.setItem(
            "readerTheme",
            "dark"
        );


        if (epubRendition) {

            setEpubTheme(
                "dark"
            );

        }

    }

}


/* =========================================================
   RESTORE READER THEME
========================================================= */

const savedTheme =
    localStorage.getItem(
        "readerTheme"
    ) || "dark";


document.body.classList.remove(
    "dark",
    "light",
    "sepia"
);


document.body.classList.add(
    savedTheme
);


/* =========================================================
   FULLSCREEN
========================================================= */

async function toggleFullscreen() {

    try {

        if (
            !document.fullscreenElement
        ) {

            await document.documentElement
                .requestFullscreen();

        }

        else {

            await document.exitFullscreen();

        }

    }
    catch(error) {

        console.error(
            "Fullscreen error:",
            error
        );

    }

}


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    async function(event) {

        /*
           Don't intercept keys when typing
           into an input.
        */

        if (
            event.target.tagName ===
            "INPUT"
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            await nextPage();

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            await previousPage();

        }


        else if (
            event.key ===
            "+"
            ||
            event.key ===
            "="
        ) {

            await zoomIn();

        }


        else if (
            event.key ===
            "-"
        ) {

            await zoomOut();

        }


        else if (
            event.key ===
            "f"
            ||
            event.key ===
            "F"
        ) {

            await toggleFullscreen();

        }

    }
);


/* =========================================================
   BACK TO BOOKSHELF
========================================================= */

function goBack() {

    /*
       Your Flask route is /bookshelf.
    */

    window.location.href =
        "/bookshelf";

}


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    function() {

        initialize();

    }
);
