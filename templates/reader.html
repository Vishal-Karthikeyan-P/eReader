<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }} - eReader</title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/reader.css') }}"
    >


    <!-- PDF.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/build/pdf.min.mjs"
        type="module"
    ></script>


    <!-- EPUB.js dependencies -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"
    ></script>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="reader-header">


    <a
        href="/"
        class="back-button"
        title="Back to bookshelf"
    >
        ←
    </a>


    <div class="reader-title">

        <span id="bookTitle">
            {{ title }}
        </span>

        <span
            id="readerType"
            class="reader-type"
        >
            Loading
        </span>

    </div>


    <div class="header-actions">


        <button
            id="themeButton"
            class="icon-button"
            title="Change theme"
        >
            ◐
        </button>


        <button
            id="fullscreenButton"
            class="icon-button"
            title="Fullscreen"
        >
            ⛶
        </button>


        <button
            id="settingsButton"
            class="icon-button"
            title="Settings"
        >
            ⚙
        </button>


    </div>

</header>



<!-- =====================================================
     LOADING
===================================================== -->

<div id="loadingScreen">

    <div class="loader"></div>

    <div>
        Opening book...
    </div>

</div>



<!-- =====================================================
     ERROR
===================================================== -->

<div
    id="errorScreen"
    class="hidden"
>

    <div class="error-icon">
        ⚠
    </div>

    <h2>
        Unable to open this book
    </h2>

    <p id="errorMessage">
        Something went wrong while loading the book.
    </p>

    <a href="/">
        Return to bookshelf
    </a>

</div>



<!-- =====================================================
     PDF READER
===================================================== -->

<section
    id="pdfReader"
    class="reader-section hidden"
>


    <div
        id="pdfViewport"
        class="pdf-viewport"
    >

        <div
            id="pdfPages"
            class="pdf-pages"
        ></div>

    </div>


    <!-- PDF bottom controls -->

    <div class="reader-controls">


        <button
            id="pdfPrevious"
            class="control-button"
        >
            ‹
        </button>


        <div class="page-info">

            <input
                id="pdfPageInput"
                type="number"
                min="1"
                value="1"
            >

            <span>
                /
            </span>

            <span id="pdfTotalPages">
                0
            </span>

        </div>


        <button
            id="pdfNext"
            class="control-button"
        >
            ›
        </button>


        <div class="control-separator"></div>


        <button
            id="pdfZoomOut"
            class="control-button"
        >
            −
        </button>


        <span id="pdfZoomValue">
            100%
        </span>


        <button
            id="pdfZoomIn"
            class="control-button"
        >
            +
        </button>


        <div class="control-separator"></div>


        <button
            id="pdfRotate"
            class="control-button"
        >
            ↻
        </button>


        <div class="progress-wrapper">

            <div class="progress-label">
                <span>Progress</span>

                <span id="pdfProgress">
                    0%
                </span>
            </div>


            <div class="progress-bar">

                <div
                    id="pdfProgressBar"
                    class="progress-fill"
                ></div>

            </div>

        </div>


    </div>

</section>



<!-- =====================================================
     EPUB READER
===================================================== -->

<section
    id="epubReader"
    class="reader-section hidden"
>


    <div class="epub-layout">


        <!-- TOC -->

        <aside
            id="tocPanel"
            class="toc-panel"
        >

            <div class="panel-title">
                Contents
            </div>

            <div
                id="tocList"
                class="toc-list"
            ></div>

        </aside>


        <!-- EPUB content -->

        <main class="epub-main">


            <div
                id="epubViewer"
                class="epub-viewer"
            ></div>


            <div class="epub-controls">


                <button
                    id="epubPrevious"
                    class="control-button"
                >
                    ‹
                </button>


                <button
                    id="epubNext"
                    class="control-button"
                >
                    ›
                </button>


                <span
                    id="epubProgress"
                    class="epub-progress"
                >
                    0%
                </span>


                <div class="progress-bar epub-progress-bar">

                    <div
                        id="epubProgressBar"
                        class="progress-fill"
                    ></div>

                </div>


                <button
                    id="epubSettings"
                    class="control-button"
                >
                    Aa
                </button>


            </div>

        </main>

    </div>

</section>



<!-- =====================================================
     SETTINGS PANEL
===================================================== -->

<div
    id="settingsPanel"
    class="settings-panel hidden"
>


    <div class="settings-header">

        <strong>
            Reading Settings
        </strong>

        <button
            id="closeSettings"
            class="close-button"
        >
            ×
        </button>

    </div>


    <!-- Theme -->

    <div class="setting-group">

        <label>
            Theme
        </label>


        <div class="theme-options">


            <button
                class="theme-option"
                data-theme="light"
            >
                Light
            </button>


            <button
                class="theme-option"
                data-theme="sepia"
            >
                Sepia
            </button>


            <button
                class="theme-option"
                data-theme="dark"
            >
                Dark
            </button>


        </div>

    </div>


    <!-- Font size -->

    <div class="setting-group">

        <label>
            Font Size
        </label>


        <div class="setting-row">

            <button
                id="fontDecrease"
                class="control-button"
            >
                A−
            </button>


            <span id="fontSizeValue">
                100%
            </span>


            <button
                id="fontIncrease"
                class="control-button"
            >
                A+
            </button>

        </div>

    </div>


    <!-- Line spacing -->

    <div class="setting-group">

        <label>
            Line Spacing
        </label>


        <input
            id="lineSpacing"
            type="range"
            min="1"
            max="2"
            step="0.1"
            value="1.5"
        >

        <span id="lineSpacingValue">
            1.5
        </span>

    </div>


    <!-- Margins -->

    <div class="setting-group">

        <label>
            Page Margins
        </label>


        <input
            id="pageMargin"
            type="range"
            min="10"
            max="100"
            step="5"
            value="40"
        >

        <span id="pageMarginValue">
            40px
        </span>

    </div>


</div>



<script>

    window.READER_CONFIG = {

        title: {{ title | tojson }},

        originalUrl: {{ link | tojson }},

        proxyUrl:
            "/book?url=" +
            encodeURIComponent(
                {{ link | tojson }}
            )

    };

</script>


<script
    src="{{ url_for('static', filename='js/reader.js') }}"
    type="module"
></script>


</body>

</html>
