<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Connect Library - Book Reader
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f6f7fb,
                    #eef1f8
                );

            color: #111827;

        }


        .container {

            width:
                min(92%, 620px);

            background: white;

            padding: 46px;

            border-radius: 24px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, .10);

        }


        .logo {

            width: 64px;

            height: 64px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111827;

            border-radius: 18px;

            margin-bottom: 28px;

        }


        .logo span {

            font-size: 30px;

        }


        h1 {

            margin: 0 0 12px;

            font-size: 32px;

            letter-spacing: -1px;

        }


        .description {

            color: #687084;

            line-height: 1.65;

            margin-bottom: 32px;

        }


        label {

            display: block;

            font-weight: 600;

            margin-bottom: 10px;

        }


        input {

            width: 100%;

            padding: 15px;

            border: 1px solid #d9dde7;

            border-radius: 12px;

            outline: none;

            font-size: 14px;

        }


        input:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px
                rgba(99,102,241,.12);

        }


        button {

            width: 100%;

            margin-top: 18px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #111827;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

        }


        button:hover {

            background: #252c3b;

        }


        button:disabled {

            opacity: .6;

            cursor: wait;

        }


        .message {

            margin-top: 18px;

            padding: 14px;

            border-radius: 10px;

            display: none;

            line-height: 1.55;

            font-size: 14px;

        }


        .error {

            display: block;

            background: #fff1f2;

            color: #be123c;

        }


        .success {

            display: block;

            background: #ecfdf5;

            color: #047857;

        }


        .debug {

            margin-top: 12px;

            padding: 12px;

            border-radius: 8px;

            background: #f4f5f7;

            color: #4b5563;

            font-family: monospace;

            font-size: 12px;

            white-space: pre-wrap;

            word-break: break-word;

        }


        .hint {

            margin-top: 22px;

            color: #7a8293;

            font-size: 13px;

            line-height: 1.6;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        <span>
            📚
        </span>

    </div>


    <h1>
        Connect your library
    </h1>


    <p class="description">

        Create a private keyword to sync your library
        and reading progress across devices. Keep it
        private: anyone who knows it can access your account.

    </p>


    <form id="setupForm">

        <label for="keyword">

            Private Keyword

        </label>


        <input
            id="keyword"
            type="password"
            minlength="12"
            maxlength="64"
            pattern="[A-Za-z0-9_-]{12,64}"
            placeholder="12-64 letters, numbers, _ or -"
            autocomplete="off"
            required
        >


        <label for="folderUrl">

            Google Drive Folder (leave blank to restore)

        </label>


        <input
            id="folderUrl"
            type="text"
            placeholder="https://drive.google.com/drive/folders/..."
            autocomplete="off"
        >


        <button
            id="connectButton"
            type="submit"
        >

            Connect Library

        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="debug"
        class="debug"
        style="display:none"
    ></div>


    <div class="hint">

        Make sure the folder is shared as

        <strong>
            Anyone with the link → Viewer
        </strong>

        <br>

        Only PDF and EPUB files directly inside
        this folder are loaded.

    </div>


</div>


<script>

/* ==========================================================
   ELEMENTS
========================================================== */

const form =
    document.getElementById(
        "setupForm"
    );


const input =
    document.getElementById(
        "folderUrl"
    );


const keywordInput =
    document.getElementById(
        "keyword"
    );


const button =
    document.getElementById(
        "connectButton"
    );


const message =
    document.getElementById(
        "message"
    );


const debug =
    document.getElementById(
        "debug"
    );


/* ==========================================================
   STORAGE KEY
==========================================================

   IMPORTANT:

   This MUST match bookshelf.js:

       driveFolderUrl

========================================================== */

const FOLDER_KEY =
    "driveFolderUrl";

const KEYWORD_KEY =
    "readerAccountKeyword";


/* ==========================================================
   RESTORE SAVED FOLDER
========================================================== */

const savedFolder =
    localStorage.getItem(
        FOLDER_KEY
    );

const savedKeyword =
    localStorage.getItem(
        KEYWORD_KEY
    );


if (savedKeyword) {

    keywordInput.value =
        savedKeyword;

} else if (savedFolder) {

    input.value =
        savedFolder;

}


/* ==========================================================
   CONNECT LIBRARY
========================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const folderUrl =
            input.value.trim();

        const keyword =
            keywordInput.value.trim().toLowerCase();


        if (!keyword) {

            showError(
                "Please enter your private keyword."
            );

            return;

        }


        button.disabled =
            true;


        button.textContent =
            "Checking Google Drive...";


        message.style.display =
            "none";


        debug.style.display =
            "none";


        try {

            if (!folderUrl) {

                button.textContent =
                    "Restoring library...";

                const response = await fetch(
                    "/api/account/session",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ keyword })
                    }
                );

                const account = await response.json();
                if (!response.ok || !account.success) {
                    throw new Error(
                        account.error || "Unable to restore account."
                    );
                }

                localStorage.setItem(KEYWORD_KEY, keyword);
                localStorage.setItem(FOLDER_KEY, account.folderUrl);
                localStorage.setItem(
                    "readingHistory",
                    JSON.stringify(account.history || [])
                );

                Object.entries(account.readingData || {}).forEach(
                    ([bookId, readingData]) => {
                        localStorage.setItem(
                            "reading_" + bookId,
                            JSON.stringify(readingData)
                        );
                    }
                );

                window.location.href = "/bookshelf";
                return;

            }

            /* ------------------------------------------------
               CALL THE CORRECT BACKEND ENDPOINT
            ------------------------------------------------ */

            const apiUrl =
                "/api/books?folder="
                +
                encodeURIComponent(
                    folderUrl
                );


            console.log(
                "Requesting:",
                apiUrl
            );


            const response =
                await fetch(
                    apiUrl,
                    {
                        cache:
                            "no-store"
                    }
                );


            /* ------------------------------------------------
               Read response as text first.

               This makes server errors easier to diagnose.
            ------------------------------------------------ */

            const responseText =
                await response.text();


            console.log(
                "API response:",
                responseText
            );


            let data;


            try {

                data =
                    JSON.parse(
                        responseText
                    );

            } catch (jsonError) {

                console.error(
                    "Invalid JSON:",
                    responseText
                );

                throw new Error(
                    "Server returned an invalid response."
                );

            }


            /* ------------------------------------------------
               API ERROR
            ------------------------------------------------ */

            if (
                !response.ok
                ||
                !data.success
            ) {

                throw new Error(
                    data.error
                    ||
                    "Google Drive request failed."
                );

            }


            /* ------------------------------------------------
               NO BOOKS
            ------------------------------------------------ */

            if (
                !data.books
                ||
                data.books.length === 0
            ) {

                message.className =
                    "message error";


                message.style.display =
                    "block";


                message.innerHTML =
                    "❌ Google Drive was accessed successfully, " +
                    "but no PDF or EPUB books were found.";


                debug.style.display =
                    "block";


                debug.textContent =
                    JSON.stringify(
                        data,
                        null,
                        2
                    );


                button.disabled =
                    false;


                button.textContent =
                    "Connect Library";


                return;

            }


            const readingData = {};
            for (let index = 0; index < localStorage.length; index++) {
                const key = localStorage.key(index);
                if (key && key.startsWith("reading_")) {
                    try {
                        readingData[key.slice(8)] = JSON.parse(
                            localStorage.getItem(key)
                        );
                    } catch {
                        // Ignore malformed browser cache entries.
                    }
                }
            }

            let history = [];
            try {
                history = JSON.parse(
                    localStorage.getItem("readingHistory") || "[]"
                );
                if (!Array.isArray(history)) history = [];
            } catch {
                history = [];
            }

            const accountResponse = await fetch(
                "/api/account",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        keyword,
                        folderUrl,
                        readingData,
                        history
                    })
                }
            );

            const accountResult = await accountResponse.json();
            if (!accountResponse.ok || !accountResult.success) {
                throw new Error(
                    accountResult.error || "Unable to create account."
                );
            }


            /* ------------------------------------------------
               SAVE FOLDER URL
            ------------------------------------------------

               This is the important part.

               The bookshelf JS uses:

                   driveFolderUrl
            ------------------------------------------------ */

            localStorage.setItem(
                FOLDER_KEY,
                folderUrl
            );

            localStorage.setItem(
                KEYWORD_KEY,
                keyword
            );


            /* ------------------------------------------------
               SAVE BOOK LIST

               This is only a cache.

               The bookshelf will check Drive again
               whenever it loads.
            ------------------------------------------------ */

            localStorage.setItem(
                "books",
                JSON.stringify(
                    data.books
                )
            );


            /* ------------------------------------------------
               SAVE LAST CHECK TIME
            ------------------------------------------------ */

            localStorage.setItem(
                "libraryLastChecked",
                new Date().toISOString()
            );


            /* ------------------------------------------------
               SUCCESS
            ------------------------------------------------ */

            message.className =
                "message success";


            message.style.display =
                "block";


            message.textContent =
                "✓ "
                +
                data.books.length
                +
                " books found. Opening bookshelf...";


            /* ------------------------------------------------
               GO TO BOOKSHELF
            ------------------------------------------------ */

            setTimeout(
                function() {

                    window.location.href =
                        "/bookshelf";

                },
                700
            );


        } catch (error) {

            console.error(
                "Setup error:",
                error
            );


            showError(
                error.message
            );


            button.disabled =
                false;


            button.textContent =
                "Connect Library";

        }

    }
);


/* ==========================================================
   ERROR DISPLAY
========================================================== */

function showError(
    text
) {

    message.className =
        "message error";


    message.style.display =
        "block";


    message.textContent =
        "❌ " + text;

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value || "";


    return div.innerHTML;

}

</script>


</body>

</html>
