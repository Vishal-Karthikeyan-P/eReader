<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookshelf</title>

    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

<header class="topbar">

    <div class="brand">
        📚 Book Reader
    </div>

    <div class="toolbar">

        <button id="refreshButton">
            ↻ Check for Updates
        </button>

        <button id="changeFolderButton">
            ⚙ Change Folder
        </button>

        <button id="viewButton">
            ☷
        </button>

    </div>

</header>


<main class="container">

    <section class="library-header">

        <div>

            <h1>My Bookshelf</h1>

            <p id="libraryStatus">
                Loading library...
            </p>

        </div>

    </section>


    <section id="continueSection"
             class="section">

        <h2>Continue Reading</h2>

        <div id="continueBooks"
             class="books-grid">
        </div>

    </section>


    <section class="section">

        <div class="section-heading">

            <h2>All Books</h2>

            <div>

                <button
                    class="filter-button active"
                    data-filter="all">
                    All
                </button>

                <button
                    class="filter-button"
                    data-filter="progress">
                    Reading
                </button>

                <button
                    class="filter-button"
                    data-filter="completed">
                    Completed
                </button>

            </div>

        </div>

        <div id="books"
             class="books-grid">
        </div>

    </section>


    <section id="historySection"
             class="section">

        <h2>Reading History</h2>

        <div id="history"
             class="history-list">
        </div>

    </section>

</main>


<script src="/static/js/app.js"></script>

</body>
</html>
