<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Book Reader</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f6f7fb;

    color: #111827;
}

header {

    position: sticky;

    top: 0;

    z-index: 10;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(12px);

    border-bottom:
        1px solid #e5e7eb;
}

.header-inner {

    max-width: 1250px;

    margin: auto;

    padding:
        16px 24px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}

.brand-icon {

    width: 42px;

    height: 42px;

    border-radius: 12px;

    background: #111827;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 20px;
}

.brand h1 {

    margin: 0;

    font-size: 18px;
}

.brand span {

    color: #8a91a1;

    font-size: 12px;
}

.actions {

    display: flex;

    gap: 8px;
}

.action-button {

    border:
        1px solid #e1e4eb;

    background: white;

    padding:
        10px 14px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: 600;
}

.action-button:hover {

    background: #f1f3f7;
}

main {

    max-width: 1250px;

    margin: auto;

    padding:
        35px 24px 60px;
}

.hero {

    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 28px;
}

.hero h2 {

    margin: 0;

    font-size:
        clamp(30px,4vw,42px);

    letter-spacing: -1px;
}

.hero p {

    color: #737b8c;

    margin:
        7px 0 0;
}

.stats {

    display: flex;

    gap: 10px;
}

.stat {

    background: white;

    border:
        1px solid #e5e7eb;

    padding:
        12px 16px;

    border-radius: 13px;

    min-width: 100px;
}

.stat strong {

    display: block;

    font-size: 20px;
}

.stat span {

    color: #7d8595;

    font-size: 12px;
}

.toolbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 24px;

    gap: 15px;
}

.search {

    width:
        min(320px,60vw);

    padding:
        12px 14px;

    border:
        1px solid #dfe3ea;

    border-radius: 10px;

    background: white;

    outline: none;
}

.search:focus {

    border-color: #6366f1;

    box-shadow:
        0 0 0 3px
        rgba(99,102,241,.1);
}

.view-toggle {

    display: flex;

    border:
        1px solid #dfe3ea;

    border-radius: 10px;

    overflow: hidden;

    background: white;
}

.view-toggle button {

    border: none;

    background: white;

    padding:
        10px 14px;

    cursor: pointer;
}

.view-toggle button.active {

    background: #111827;

    color: white;
}

#bookshelf {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px,1fr)
        );

    gap: 22px;
}

.book-card {

    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 16px;

    overflow: hidden;

    transition:
        .2s;
}

.book-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 14px 35px
        rgba(0,0,0,.08);
}

.cover {

    height: 250px;

    background:
        linear-gradient(
            135deg,
            #e8eaf1,
            #cfd4df
        );

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}

.cover img {

    width: 100%;

    height: 100%;

    object-fit: cover;
}

.placeholder {

    font-size: 55px;
}

.book-info {

    padding: 15px;
}

.book-title {

    margin: 0;

    min-height: 44px;

    font-size: 16px;

    line-height: 1.35;
}

.book-type {

    display: inline-block;

    margin-top: 8px;

    font-size: 10px;

    font-weight: 700;

    background: #eef0ff;

    color: #575bd6;

    padding:
        4px 7px;

    border-radius: 6px;
}

.progress-container {

    margin-top: 14px;
}

.progress-label {

    display: flex;

    justify-content: space-between;

    color: #818899;

    font-size: 11px;

    margin-bottom: 5px;
}

.progress {

    height: 5px;

    background: #e6e8ed;

    border-radius: 5px;

    overflow: hidden;
}

.progress-bar {

    height: 100%;

    background: #6366f1;
}

.read-button {

    width: 100%;

    border: none;

    background: #111827;

    color: white;

    padding: 10px;

    border-radius: 9px;

    margin-top: 14px;

    cursor: pointer;

    font-weight: 600;
}

.read-button:hover {

    background: #292f3d;
}

.loading,
.empty,
.error {

    grid-column: 1/-1;

    background: white;

    border-radius: 16px;

    padding: 60px 25px;

    text-align: center;
}

.loading {

    color: #7c8494;
}

.error {

    background: #fff1f2;

    color: #be123c;

    text-align: left;
}

.empty-icon {

    font-size: 45px;
}

#bookshelf.list-view {

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.list-view .book-card {

    display: flex;

    align-items: center;

    padding: 10px;
}

.list-view .cover {

    width: 70px;

    height: 90px;

    flex-shrink: 0;

    border-radius: 8px;
}

.list-view .book-info {

    flex: 1;

    padding:
        0 15px;
}

.list-view .book-title {

    min-height: 0;
}

.list-view .read-button {

    width: 120px;

    margin:
        0 10px 0 0;
}

@media(max-width:700px) {

    .header-inner {

        padding:
            14px 16px;
    }

    main {

        padding:
            25px 16px;
    }

    .hero {

        flex-direction: column;

        align-items: flex-start;
    }

    .stats {

        width: 100%;
    }

    .stat {

        flex: 1;
    }

    .toolbar {

        flex-direction: column;

        align-items: stretch;
    }

    .search {

        width: 100%;
    }

    #bookshelf {

        grid-template-columns:
            repeat(2,1fr);

        gap: 12px;
    }

    .cover {

        height: 210px;
    }

    .list-view .book-card {

        flex-wrap: wrap;
    }

    .list-view .read-button {

        width: 100%;

        margin: 10px 0 0;
    }
}

</style>

</head>


<body>


<header>

<div class="header-inner">

    <div class="brand">

        <div class="brand-icon">
            📚
        </div>

        <div>

            <h1>
                Book Reader
            </h1>

            <span>
                Your personal library
            </span>

        </div>

    </div>


    <div class="actions">

        <button
            class="action-button"
            id="updateButton"
            onclick="checkForUpdates()"
        >
            ↻ Check Updates
        </button>


        <button
            class="action-button"
            onclick="changeLibrary()"
        >
            ⚙ Library
        </button>

    </div>

</div>

</header>


<main>


<section class="hero">

    <div>

        <h2>
            My Bookshelf
        </h2>

        <p id="lastUpdated">
            Loading your library...
        </p>

    </div>


    <div class="stats">

        <div class="stat">

            <strong id="totalBooks">
                0
            </strong>

            <span>
                Books
            </span>

        </div>


        <div class="stat">

            <strong id="completedBooks">
                0
            </strong>

            <span>
                Completed
            </span>

        </div>

    </div>

</section>


<div class="toolbar">

    <input
        class="search"
        id="search"
        type="search"
        placeholder="Search books..."
    >


    <div class="view-toggle">

        <button
            id="gridButton"
            class="active"
            onclick="setView('grid')"
        >
            ▦
        </button>

        <button
            id="listButton"
            onclick="setView('list')"
        >
            ☰
        </button>

    </div>

</div>


<div id="bookshelf">

    <div class="loading">
        Loading your library...
    </div>

</div>


</main>


<script>

let allBooks = [];

let currentView =
    localStorage.getItem(
        "bookshelfView"
    ) || "grid";


// ============================================================
// UPDATE STATS
// ============================================================

function updateStats() {

    const total =
        allBooks.length;


    let completed = 0;


    allBooks.forEach(
        book => {

            if (
                getProgress(book) >= 100
            ) {

                completed++;

            }

        }
    );


    document.getElementById(
        "totalBooks"
    ).textContent =
        total;


    document.getElementById(
        "completedBooks"
    ).textContent =
        completed;
}


// ============================================================
// GET BOOK PROGRESS
// ============================================================

function getProgress(book) {

    const key =
        "reading_" +
        book.id;


    const saved =
        localStorage.getItem(
            key
        );


    if (!saved) {
        return 0;
    }


    try {

        const data =
            JSON.parse(saved);


        return Math.max(
            0,
            Math.min(
                100,
                Number(
                    data.progress || 0
                )
            )
        );

    } catch {

        return 0;

    }
}


// ============================================================
// LOAD LIBRARY
// ============================================================

async function loadBooks(
    showLoading = true
) {

    const folder =
        localStorage.getItem(
            "driveFolder"
        );


    if (!folder) {

        window.location.href =
            "/setup";

        return;

    }


    if (showLoading) {

        document.getElementById(
            "bookshelf"
        ).innerHTML = `
            <div class="loading">
                Loading your library...
            </div>
        `;

    }


    try {

        const response =
            await fetch(
                "/api/library?folder=" +
                encodeURIComponent(
                    folder
                ) +
                "&t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to load library."
            );

        }


        allBooks =
            data.books || [];


        localStorage.setItem(
            "books",
            JSON.stringify(
                allBooks
            )
        );


        localStorage.setItem(
            "libraryLastChecked",
            new Date().toISOString()
        );


        updateStats();

        displayBooks(
            allBooks
        );


        document.getElementById(
            "lastUpdated"
        ).textContent =
            `${allBooks.length} books · Last checked just now`;


    } catch (error) {

        console.error(
            error
        );


        // Try cached library

        try {

            const cached =
                JSON.parse(
                    localStorage.getItem(
                        "books"
                    ) || "[]"
                );


            if (cached.length) {

                allBooks =
                    cached;

                updateStats();

                displayBooks(
                    allBooks
                );

                document.getElementById(
                    "lastUpdated"
                ).textContent =
                    "Showing cached library";

                return;

            }

        } catch {

            // Nothing cached
        }


        document.getElementById(
            "bookshelf"
        ).innerHTML = `

            <div class="error">

                <strong>
                    ❌ Unable to load your library.
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


// ============================================================
// DISPLAY
// ============================================================

function displayBooks(
    books
) {

    const bookshelf =
        document.getElementById(
            "bookshelf"
        );


    const query =
        document.getElementById(
            "search"
        ).value
        .trim()
        .toLowerCase();


    const filtered =
        books.filter(
            book =>
                book.title
                    .toLowerCase()
                    .includes(query)
        );


    if (!filtered.length) {

        bookshelf.className = "";

        bookshelf.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📚
                </div>

                <h2>
                    ${
                        query
                        ? "No matching books"
                        : "No books found"
                    }
                </h2>

                <p>
                    ${
                        query
                        ? "Try another search."
                        : "No PDF or EPUB books were found."
                    }
                </p>

            </div>

        `;

        return;

    }


    bookshelf.className =
        currentView === "list"
        ? "list-view"
        : "";


    bookshelf.innerHTML = "";


    filtered.forEach(
        book => {

            const card =
                createBookCard(
                    book
                );

            bookshelf.appendChild(
                card
            );

        }
    );

}


// ============================================================
// BOOK CARD
// ============================================================

function createBookCard(
    book
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "book-card";


    const progress =
        getProgress(
            book
        );


    const completed =
        progress >= 100;


    let cover;


    if (book.thumbnail) {

        cover = `

            <img
                src="${escapeAttribute(book.thumbnail)}"
                alt="${escapeAttribute(book.title)}"
                loading="lazy"
            >

        `;

    } else {

        cover = `

            <div class="placeholder">

                ${
                    book.type === "pdf"
                    ? "📕"
                    : "📘"
                }

            </div>

        `;

    }


    card.innerHTML = `

        <div class="cover">

            ${cover}

        </div>


        <div class="book-info">

            <h3 class="book-title">

                ${escapeHtml(
                    book.title
                )}

            </h3>


            <span class="book-type">

                ${book.type.toUpperCase()}

            </span>


            <div class="progress-container">

                <div class="progress-label">

                    <span>
                        ${
                            completed
                            ? "Completed"
                            : "Progress"
                        }
                    </span>

                    <span>
                        ${progress}%
                    </span>

                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width:${progress}%"
                    ></div>

                </div>

            </div>


            <button
                class="read-button"
            >

                ${
                    completed
                    ? "Read Again"
                    : progress > 0
                    ? "Continue Reading"
                    : "Start Reading"
                }

            </button>

        </div>

    `;


    // IMPORTANT:
    // Don't put the complete object inside
    // inline HTML JavaScript.
    //
    // Store it through the click handler.

    card.querySelector(
        ".read-button"
    ).addEventListener(
        "click",
        function() {

            openBook(
                book
            );

        }
    );


    return card;
}


// ============================================================
// OPEN BOOK
// ============================================================

function openBook(
    book
) {

    console.log(
        "Opening book:",
        book
    );


    // IMPORTANT:
    // Reader uses exactly this key.

    localStorage.setItem(
        "currentBook",
        JSON.stringify(
            book
        )
    );


    // Reading history

    let history = [];


    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "readingHistory"
                ) || "[]"
            );

    } catch {

        history = [];

    }


    history =
        history.filter(
            item =>
                item.id !== book.id
        );


    history.unshift({

        id:
            book.id,

        title:
            book.title,

        type:
            book.type,

        openedAt:
            new Date().toISOString()

    });


    localStorage.setItem(
        "readingHistory",
        JSON.stringify(
            history.slice(
                0,
                50
            )
        )
    );


    // Go to reader

    window.location.href =
        "/reader";

}


// ============================================================
// CHECK UPDATES
// ============================================================

async function checkForUpdates() {

    const button =
        document.getElementById(
            "updateButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Checking...";


    await loadBooks(
        false
    );


    button.disabled =
        false;


    button.textContent =
        "↻ Check Updates";

}


// ============================================================
// CHANGE LIBRARY
// ============================================================

function changeLibrary() {

    window.location.href =
        "/setup";

}


// ============================================================
// VIEW
// ============================================================

function setView(
    view
) {

    currentView =
        view;


    localStorage.setItem(
        "bookshelfView",
        view
    );


    document.getElementById(
        "gridButton"
    ).classList.toggle(
        "active",
        view === "grid"
    );


    document.getElementById(
        "listButton"
    ).classList.toggle(
        "active",
        view === "list"
    );


    displayBooks(
        allBooks
    );

}


// ============================================================
// SEARCH
// ============================================================

document.getElementById(
    "search"
).addEventListener(
    "input",
    function() {

        displayBooks(
            allBooks
        );

    }
);


// ============================================================
// ESCAPE
// ============================================================

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value || "";

    return div.innerHTML;
}


function escapeAttribute(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#39;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );

}


// ============================================================
// INITIALIZE
// ============================================================

if (
    currentView === "list"
) {

    document.getElementById(
        "gridButton"
    ).classList.remove(
        "active"
    );

    document.getElementById(
        "listButton"
    ).classList.add(
        "active"
    );

}


loadBooks();

</script>

</body>

</html>
